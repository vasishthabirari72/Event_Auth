[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "event-auth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "opencv-python>=4.10,<5",
  "numpy>=2,<3",
  "cryptography>=46,<51",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "reportlab>=4.4,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
event-auth-face-test = "event_auth.face_lab:main"
event-auth-admin = "event_auth.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/event_auth"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src"]
[[tool.mypy.overrides]]
module = ["cv2.*", "reportlab.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--cov=event_auth.core --cov-report=term-missing --cov-fail-under=80"
markers = ["postgres: requires isolated TEST_DATABASE_URL"]
